[project]
name = "desktop-api-usage"
version = "0.1.0"
description = "Desktop monitor for Kimi / ChatGPT / Antigravity usage quotas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
api-usage-monitor = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "providers.py"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
